name: Vigiar índice de categorias

on:
  schedule:
    - cron: "16,46 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-category-index.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: category-index-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verificar execuções bloqueadas
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const workflow_id = 'update-index.yml';
            const hour = 60 * 60 * 1000;

            const old = run =>
              Date.now() - Date.parse(run.updated_at) > hour;

            let cancelled = 0;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                ...repo,
                workflow_id,
                status: 'waiting',
                per_page: 100
              }
            );

            for (const run of runs) {
              if (run.head_branch !== 'main' || !old(run)) {
                continue;
              }

              const args = {
                ...repo,
                run_id: run.id
              };

              const { data: current } =
                await github.rest.actions.getWorkflowRun(args);

              if (current.status !== 'waiting' || !old(current)) {
                continue;
              }

              const { data: pending } =
                await github.rest.actions.getPendingDeploymentsForRun(args);

              const matches =
                pending.length > 0 &&
                pending.every(p =>
                  p.environment?.name === 'github-pages' &&
                  Array.isArray(p.reviewers) &&
                  p.reviewers.length === 0 &&
                  p.wait_timer === 0
                );

              if (!matches) {
                core.setFailed(
                  `Execução #${run.run_number} em espera: ` +
                  `verificar as regras de aprovação. ${run.html_url}`
                );
                continue;
              }

              try {
                await github.rest.actions.cancelWorkflowRun(args);
                cancelled++;

                core.notice(
                  `Cancelamento solicitado para #${run.run_number}, ` +
                  'em espera há mais de uma hora.'
                );
              } catch (error) {
                const { data: after } =
                  await github.rest.actions.getWorkflowRun(args);

                if (after.status === 'waiting') {
                  throw error;
                }

                core.info(
                  `A execução #${run.run_number} já mudou de estado.`
                );
              }
            }

            const { data } =
              await github.rest.actions.listWorkflowRuns({
                ...repo,
                workflow_id,
                branch: 'main',
                status: 'success',
                per_page: 1
              });

            const last = data.workflow_runs[0];

            if (
              !last ||
              Date.now() - Date.parse(last.updated_at) > 6 * hour
            ) {
              if (cancelled) {
                core.warning(
                  'Fila libertada. A próxima verificação confirmará ' +
                  'se a atualização das categorias recuperou.'
                );
              } else {
                core.setFailed(
                  'Sem verificação das categorias concluída há mais ' +
                  'de 6 horas. Verificar o workflow de atualização.'
                );
              }
            }

            await core.summary
              .addRaw(
                'Verificação concluída. ' +
                `Cancelamentos solicitados: ${cancelled}.`
              )
              .write();
