name: Atualizar índice de categorias

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-index.yml"
      - "scripts/**"
      - "package.json"
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "13 4 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "Reconstruir todo o índice"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: category-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Escolher atualização
        id: mode
        shell: bash
        run: |
          mode="incremental"
          if [[ "${{ github.event_name }}" == "push" ]]; then mode="full"; fi
          if [[ "${{ github.event.schedule }}" == "13 4 * * 0" ]]; then mode="full"; fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full }}" == "true" ]]; then mode="full"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Gerar índice
        id: index
        shell: bash
        run: |
          output="$(node scripts/build-index.mjs --mode "${{ steps.mode.outputs.mode }}")"
          printf '%s\n' "$output"
          changed="$(printf '%s\n' "$output" | sed -n 's/^INDEX_CHANGED=//p' | tail -n 1)"
          echo "changed=${changed:-false}" >> "$GITHUB_OUTPUT"

      - name: Guardar índice atualizado
        if: steps.index.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "termometro-index-bot"
          git config user.email "termometro-index-bot@users.noreply.github.com"
          git add data/index.json public/categorias.json public/categorias.js
          git commit -m "Atualizar índice de categorias"
          git push

      - name: Configurar GitHub Pages
        if: steps.index.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Preparar publicação
        if: steps.index.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar índice
        if: steps.index.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
