name: Atualizar índice de categorias

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-index.yml"
      - "scripts/**"
      - "package.json"

  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "13 4 * * 0"

  workflow_dispatch:
    inputs:
      full:
        description: "Reconstruir todo o índice"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: category-index-pipeline-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      changed: ${{ steps.index.outputs.changed }}

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Escolher atualização
        id: mode
        shell: bash
        run: |
          mode="incremental"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            mode="full"
          fi

          if [[ "${{ github.event.schedule }}" == "13 4 * * 0" ]]; then
            mode="full"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full }}" == "true" ]]; then
            mode="full"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Gerar índice
        id: index
        shell: bash
        run: |
          set -o pipefail

          node --test

          node scripts/build-index.mjs \
            --mode "${{ steps.mode.outputs.mode }}" \
            | tee index-build.log

          changed="$(sed -n 's/^INDEX_CHANGED=//p' index-build.log | tail -n 1)"

          if [[ "$changed" != "true" && "$changed" != "false" ]]; then
            echo "O gerador não informou INDEX_CHANGED."
            exit 1
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Guardar índice atualizado
        if: steps.index.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "termometro-index-bot"
          git config user.email "termometro-index-bot@users.noreply.github.com"

          git add data/index.json public/categorias.json public/categorias.js

          git commit -m "Atualizar índice de categorias"
          git push

      - name: Configurar GitHub Pages
        if: steps.index.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Preparar publicação
        if: steps.index.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar índice no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
